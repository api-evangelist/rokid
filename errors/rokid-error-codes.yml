notes: >-
  Rokid publishes NO error-code reference for the Sprite Enterprise OpenAPI. The
  envelope below was read from the sample responses in the provider's own device,
  message, agent, remote-collaboration and AI-work-assistant reference pages, and
  the one concrete failure code was captured from a live unauthenticated probe.
  This catalog is deliberately short: it records only codes that were actually
  observed or published. Do not read absence here as absence in the API.
format: proprietary-envelope
