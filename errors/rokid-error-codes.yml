problem_json_content_type: false
envelope:
  content_type: '*/*'
  http_status_on_error: 200
  fields:
  - name: code
    type: integer
    description: 0 on success; a non-zero integer identifies the failure.
  - name: message
    type: string
    description: Human-readable status text. Localized Chinese strings are returned
      on some failures even from the English documentation surface.
  - name: data
    type: object|array|string|null
    description: Payload on success.
  - name: success
    type: boolean
    description: The authoritative success flag. Clients must branch on this rather
      than on the HTTP status.
  note: >-
    The API answers HTTP 200 for at least some authentication failures, so HTTP
    status alone is not a reliable error signal.
