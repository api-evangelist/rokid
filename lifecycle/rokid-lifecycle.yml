    scheme: none
    version_in_path: false
    version_header: false
    detail: >-
      /ar/<product>/openapi/<resource> carries no version segment, so there is no
      way for a client to pin a contract version.
  sdk:
    scheme: semver with channel suffix — <major>.<minor>.<patch>-<E|P>
    channels:
