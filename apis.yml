- name: Rokid Store Agent Commerce API
  description: >-
    Rokid's global storefront implements the Universal Commerce Protocol for
    agent-driven commerce, with a UCP merchant profile at /.well-known/ucp and a
    live MCP endpoint exposing catalog search, cart, checkout and fulfillment to
    buying agents. Checkout requires contemporaneous buyer approval.
