    The Rokid Glass3 / Sprite Enterprise cloud API. Device registration lookup
    and real-time telemetry, message push to glasses, paged AI agent chat logs,
    RTC remote-collaboration meeting history and participant records, and AI
    work-assistant task records. Bearer API key authentication; no OpenAPI
    document is published.
