aid: rokid
name: Rokid
description: >-
  Rokid is a Chinese AR and AI wearables company that designs smart glasses and
  the operating system that runs on them. Its consumer line spans Rokid Glasses,
  Rokid AI Glasses Style, Rokid AR Spatial and Rokid Max 2, and its enterprise
  line is Rokid Glass3 / Sprite, backed by the YodaOS and YodaOS-Sprite operating
  systems. Rokid exposes three distinct developer surfaces. The Sprite Enterprise
  cloud OpenAPI at api.rokid.com covers device management, message push to
  glasses, AI agent chat logs, RTC remote-collaboration meeting history and AI
  work-assistant task records, authenticated with a bearer API key issued by
  sales. Terminal SDKs for the glasses and the companion phone are distributed
  from Rokid's own Maven repository at maven.rokid.com, with a dated release
  changelog and a provider-published Agent Skill package for AI coding tools.
  Separately, the global storefront implements the Universal Commerce Protocol
  with a live MCP endpoint, an llms.txt and an agents.md for buying agents.
